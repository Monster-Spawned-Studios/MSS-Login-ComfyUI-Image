# Optional local hardware overlays. Not used by Portainer GitOps.
# cpu, rocm, and auto stay as Dockerfile targets. Only :nvidia is published,
# and only when the manual workflow's push_nvidia_tag input is set.
name: comfyui-mss-hwaccel

services:
  cuda:
    image: ghcr.io/monster-spawned-studios/comfyui-mss-login:nvidia
    environment:
      DEVICE_TYPE: cuda
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  rocm:
    image: ghcr.io/monster-spawned-studios/comfyui-mss-login:rocm
    environment:
      DEVICE_TYPE: rocm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"

  cpu:
    image: ghcr.io/monster-spawned-studios/comfyui-mss-login:cpu
    environment:
      DEVICE_TYPE: cpu
      USE_CPU: "1"
