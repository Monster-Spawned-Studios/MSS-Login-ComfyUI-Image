# Production Docker Compose for ComfyUI with MSS-Login
# Hardware-agnostic: does not assume a specific GPU backend.
# Runtime entrypoint auto-detects NVIDIA CUDA (cu130/cu128), AMD ROCm, Intel Arc/XPU, Apple Metal MPS, or CPU
# and automatically installs the matching PyTorch dependencies for ComfyUI.

services:
  comfyui:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        ACCELERATOR: ${ACCELERATOR:-auto}
    image: ${COMFYUI_IMAGE:-monster-spawned-studios/comfyui-mss-login:latest}
    container_name: comfyui-mss-login
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8188}:${PORT:-8188}/tcp"
    environment:
      # MSS-Login Security and Configuration
      - HOST_BASE_URL=${HOST_BASE_URL:-http://${HOST:-127.0.0.1}:${PORT:-8188}}
      - SECRET_KEY=${SECRET_KEY:-}
      - MSS_LOGIN_DATA_DIR=${MSS_LOGIN_DATA_DIR:-/data/mss-login}
      - CPE_EMBEDDED_CONVERT=${CPE_EMBEDDED_CONVERT:-true}
      - EXPERIMENTAL_LOGIN_BACKGROUND=${EXPERIMENTAL_LOGIN_BACKGROUND:-true}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-}
      - PYTHONUNBUFFERED=1
      # Hardware & Driver Auto-Detection (auto | cuda | rocm | xpu | metal | cpu)
      - DEVICE_TYPE=${DEVICE_TYPE:-auto}
      - USE_CPU=${USE_CPU:-0}
      # CLI Args for ComfyUI
      - CLI_ARGS=--listen ${HOST:-127.0.0.1} --port ${PORT:-8188}
    volumes:
      # Persistent MSS-Login database, secrets, backgrounds, and user workflows
      - mss_data:${MSS_LOGIN_DATA_DIR:-/data/mss-login}
      # ComfyUI assets (models, outputs, inputs, user settings)
      - comfy_models:/app/ComfyUI/models
      - comfy_output:/app/ComfyUI/output
      - comfy_input:/app/ComfyUI/input
      - comfy_user:/app/ComfyUI/user
      # Persist virtual environment so runtime-detected PyTorch wheels survive container restarts
      - comfy_venv:/app/ComfyUI/.venv
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/mss-login/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mss_data:
    driver: local
    name: comfyui_mss_data
  comfy_models:
    driver: local
    name: comfyui_models
  comfy_output:
    driver: local
    name: comfyui_output
  comfy_input:
    driver: local
    name: comfyui_input
  comfy_user:
    driver: local
    name: comfyui_user
  comfy_venv:
    driver: local
    name: comfyui_venv
