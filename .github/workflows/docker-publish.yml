name: Build and Publish Docker Images

on:
  push:
    branches:
      - "production"
      - "main"
      - "release/*"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Image variant target to build (or 'all' for all targets)"
        required: true
        type: choice
        default: "all"
        options:
          - "all"
          - "auto"
          - "nvidia"
          - "rocm"
          - "cpu"
      push:
        description: "Push built images to Docker Hub"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: "docker-publish-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  docker-build-push:
    name: Build & Push (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [auto, nvidia, rocm, cpu]
    # Filter target if specified via workflow_dispatch
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'all' || inputs.target == matrix.target }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Docker Hub Namespace & Tag Metadata
        id: meta
        run: |
          set -euo pipefail
          DOCKER_USER="${{ secrets.DOCKERHUB_USERNAME }}"
          if [ -z "$DOCKER_USER" ]; then
            DOCKER_USER="monster-spawned-studios"
          fi
          DOCKER_USER=$(echo "$DOCKER_USER" | tr '[:upper:]' '[:lower:]')
          GHCR_REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          
          REF_TAG="${{ github.ref_name }}"
          VERSION=""
          if [[ "$REF_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${REF_TAG#v}"
          elif [[ "$REF_TAG" =~ ^release/[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            VERSION="${REF_TAG#release/}"
          fi
          
          TARGET="${{ matrix.target }}"
          TAGS=()
          
          # Primary variant tag on Docker Hub
          TAGS+=("${DOCKER_USER}/comfyui-mss-login:${TARGET}")
          TAGS+=("ghcr.io/${GHCR_REPO}:${TARGET}")
          
          # Alias tags
          if [ "$TARGET" = "auto" ]; then
            TAGS+=("${DOCKER_USER}/comfyui-mss-login:latest")
            TAGS+=("ghcr.io/${GHCR_REPO}:latest")
          elif [ "$TARGET" = "nvidia" ]; then
            TAGS+=("${DOCKER_USER}/comfyui-mss-login:cuda")
            TAGS+=("ghcr.io/${GHCR_REPO}:cuda")
          fi
          
          # Release versioned tags if building from tag or release branch
          if [ -n "$VERSION" ]; then
            TAGS+=("${DOCKER_USER}/comfyui-mss-login:${VERSION}-${TARGET}")
            TAGS+=("ghcr.io/${GHCR_REPO}:${VERSION}-${TARGET}")
            if [ "$TARGET" = "auto" ]; then
              TAGS+=("${DOCKER_USER}/comfyui-mss-login:${VERSION}")
              TAGS+=("ghcr.io/${GHCR_REPO}:${VERSION}")
            fi
          fi
          
          TAGS_CSV=$(IFS=,; echo "${TAGS[*]}")
          echo "docker_user=${DOCKER_USER}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS_CSV}" >> "$GITHUB_OUTPUT"
          echo "Building target ${TARGET} with tags: ${TAGS_CSV}"

      - name: Log in to Docker Hub
        if: ${{ (github.event_name != 'workflow_dispatch' || inputs.push) && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (ghcr.io)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: ${{ (github.event_name != 'workflow_dispatch' || inputs.push) && secrets.DOCKERHUB_TOKEN != '' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=build-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.target }}
          build-args: |
            ACCELERATOR=${{ matrix.target == 'auto' && 'auto' || (matrix.target == 'nvidia' && 'cuda' || matrix.target) }}
            CUDA_VERSION=cu128
            ROCM_VERSION=rocm6.2.4
            MSS_LOGIN_REPO=https://github.com/Monster-Spawned-Studios/ComfyUI-MSS-Login.git
            MSS_LOGIN_BRANCH=production

  ntfy-notification:
    name: Notify on Docker Publish Results
    needs: [docker-build-push]
    if: always()
    uses: ./.github/workflows/ntfy-notify-reusable.yml
    with:
      title: ${{ (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) && 'Docker Publish — Succeeded' || 'Docker Publish — Failed' }}
      message: |
        === Docker Publish ===
        Result: ${{ needs.docker-build-push.result }}
      priority: ${{ (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) && '3' || '5' }}
      tags: ${{ (!contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')) && 'white_check_mark,whale' || 'warning,whale' }}
      ref_name: ${{ github.ref_name }}
    secrets: inherit

