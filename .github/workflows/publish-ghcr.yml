# Manual NVIDIA image publish. There is no push, tag, or schedule trigger.
# Portainer re-pulls ghcr.io/monster-spawned-studios/comfyui-mss-login:nvidia,
# so that tag is pushed only when push_nvidia_tag is set. The input defaults
# to false. Authentication is the workflow GITHUB_TOKEN (packages: write).
name: Publish NVIDIA image

on:
  workflow_dispatch:
    inputs:
      push_nvidia_tag:
        description: "Push the :nvidia tag (the compose default). Leave off unless this image is ready for Portainer to pull."
        type: boolean
        default: false
      tag:
        description: "Extra tag besides sha-<commit>. Do not use nvidia or latest. Blank pushes only the sha tag."
        type: string
        default: ""
      cuda_version:
        description: "PyTorch CUDA wheel channel baked into the nvidia target."
        type: string
        default: "cu130"
      mss_login_ref:
        description: "ComfyUI-MSS-Login commit SHA fetched over HTTPS. Default is 6f33be9."
        type: string
        default: "6f33be97315fa33997d98afc09f439b7a8fc4763"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PUSH_NVIDIA_TAG: ${{ inputs.push_nvidia_tag }}
      EXTRA_TAG: ${{ inputs.tag }}
      CUDA_VERSION: ${{ inputs.cuda_version }}
      MSS_LOGIN_REF: ${{ inputs.mss_login_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail

          image="ghcr.io/monster-spawned-studios/comfyui-mss-login"

          case "${CUDA_VERSION}" in
            cu128|cu130) ;;
            *)
              echo "cuda_version must be cu128 or cu130." >&2
              exit 1
              ;;
          esac

          ref="$(printf '%s' "${MSS_LOGIN_REF}" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${ref}" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "mss_login_ref must be a hex commit SHA." >&2
            exit 1
          fi

          extra="$(printf '%s' "${EXTRA_TAG}" | tr '[:upper:]' '[:lower:]')"
          if [[ -n "${extra}" && ! "${extra}" =~ ^[a-z0-9_][a-z0-9_.-]{0,127}$ ]]; then
            echo "tag must be a lowercase Docker tag." >&2
            exit 1
          fi
          if [[ "${extra}" == "latest" ]]; then
            echo "Refusing to push :latest." >&2
            exit 1
          fi
          if [[ "${extra}" == "nvidia" && "${PUSH_NVIDIA_TAG}" != "true" ]]; then
            echo "Refusing to push :nvidia while push_nvidia_tag is off." >&2
            exit 1
          fi

          sha_tag="sha-${GITHUB_SHA:0:12}"
          tags=("${image}:${sha_tag}")
          if [[ -n "${extra}" && "${extra}" != "${sha_tag}" ]]; then
            tags+=("${image}:${extra}")
          fi
          if [[ "${PUSH_NVIDIA_TAG}" == "true" ]]; then
            already="false"
            for item in "${tags[@]}"; do
              if [[ "${item}" == "${image}:nvidia" ]]; then
                already="true"
              fi
            done
            if [[ "${already}" == "false" ]]; then
              tags+=("${image}:nvidia")
            fi
          fi

          printf 'Tags to push:\n'
          printf '  %s\n' "${tags[@]}"

          {
            echo "cuda_version=${CUDA_VERSION}"
            echo "mss_login_ref=${ref}"
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push nvidia target
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: nvidia
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_VERSION=${{ steps.tags.outputs.cuda_version }}
            MSS_LOGIN_REF=${{ steps.tags.outputs.mss_login_ref }}
            MSS_LOGIN_REPO=https://github.com/Monster-Spawned-Studios/ComfyUI-MSS-Login.git
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
