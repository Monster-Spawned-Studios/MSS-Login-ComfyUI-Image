# Portainer Stack Definition for ComfyUI with MSS-Login
# Compatible with Portainer Web UI Stack Editor (Standalone Docker and Swarm)
# Hardware-agnostic: supports NVIDIA CUDA (cu130/cu128), AMD ROCm, Intel Arc/XPU, Apple Metal, or CPU.
# Supports dedicated sub-image targets: auto, nvidia, rocm, and cpu.
# Runtime entrypoint auto-detects host hardware and provisions matching PyTorch wheels.
#
# Works out of the box across macOS, Linux, and Windows 11 Pro (WSL2).

name: comfyui-mss-server

services:
  comfyui-server:
    init: true

    # --- Hardware Acceleration Companion Extension (Immich-style) ---
    # To enable hardware acceleration using companion sub-compose files
    # (modeled after Immich v3.3.5 hwaccel.ml.yml companion scripts),
    # uncomment the 'extends' block below and choose your target service:
    # extends:
    #   file: hwaccel.ml.yml
    #   service: cuda    # Options: [cuda, rocm, cpu]

    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: ${IMAGE_TARGET:-auto}
      args:
        ACCELERATOR: ${ACCELERATOR:-auto}
        CUDA_VERSION: ${CUDA_VERSION:-cu128}
        ROCM_VERSION: ${ROCM_VERSION:-rocm6.2.4}
    image: ${COMFYUI_IMAGE:-monster-spawned-studios/comfyui-mss-login:latest}
    container_name: comfyui-server
    restart: unless-stopped
    shm_size: ${SHM_SIZE:-4g}
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEM_LIMIT:-20g}
    memswap_limit: ${MEMSWAP_LIMIT:-24g}
    oom_score_adj: 500
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tty: true
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8188}:${PORT:-8188}/tcp"
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      CLI_ARGS: >-
        --listen 0.0.0.0 
        --port ${PORT:-8188} 
        --enable-cors-header=${CORS:-*} 
        --front-end-version Comfy-Org/ComfyUI_frontend@${FRONT_END_VERSION:-latest}  
        --reserve-vram ${VRAM_RESERVE_GB:-1} 
        --disable-smart-memory
        ${EXTRA_CLI_ARGS:---use-pytorch-cross-attention --cache-lru 1}
      HOST_BASE_URL: ${HOST_BASE_URL:-http://${HOST:-127.0.0.1}:${PORT:-8188}}
      SECRET_KEY: ${SECRET_KEY:-}
      MSS_LOGIN_DATA_DIR: ${MSS_LOGIN_DATA_DIR:-/data/mss-login}
      CPE_EMBEDDED_CONVERT: ${CPE_EMBEDDED_CONVERT:-true}
      EXPERIMENTAL_LOGIN_BACKGROUND: ${EXPERIMENTAL_LOGIN_BACKGROUND:-true}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-ComfyUI MSS-Login}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      DEVICE_TYPE: ${DEVICE_TYPE:-auto}
      USE_CPU: ${USE_CPU:-0}
      FORCE_REINSTALL_TORCH: ${FORCE_REINSTALL_TORCH:-0}
      COMFYUI_COPILOT_PREFER_OPENAI_AGENTS: ${PREFER_OPENAI_AGENTS:-1}

    volumes:
      - ${COMFYUI_MSS_DATA_DIR:-mss_login_data}:${MSS_LOGIN_DATA_DIR:-/data/mss-login}
      - ${COMFYUI_MODELS_DIR:-comfyui_models}:/app/ComfyUI/models
      - ${COMFYUI_OUTPUT_DIR:-comfyui_output}:/app/ComfyUI/output
      - ${COMFYUI_INPUT_DIR:-comfyui_input}:/app/ComfyUI/input
      - ${COMFYUI_USER_DIR:-comfyui_user}:/app/ComfyUI/user
      - ${COMFYUI_CUSTOM_NODES_DIR:-comfyui_custom_nodes}:/app/ComfyUI/custom_nodes
      - ${COMFYUI_VENV_DIR:-comfyui_venv}:/app/ComfyUI/.venv
    labels:
      - "com.centurylinklabs.watchtower.enable=${AUTO_UPDATE:-true}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:${PORT:-8188}/mss-login/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "${CPUS_LIMIT:-8}"
          memory: ${MEM_LIMIT:-20g}
        reservations:
          cpus: "${CPUS:-4}"
          memory: ${MEMORY:-8G}
          # --- Hardware & GPU Passthrough (Cross-Platform) ---
          # NVIDIA GPU (Linux / Windows 11 Pro WSL2 with NVIDIA Container Toolkit):
          # To allocate NVIDIA GPU(s) to ComfyUI, uncomment the 'devices' block below.
          # NOTE: Keep commented on macOS (Docker Desktop), CPU-only Linux, or AMD/Intel hosts
          # to prevent Docker deployment errors ('could not select device driver with capabilities [[gpu]]').
          # devices:
          #   - driver: nvidia
          #     count: all
          #     capabilities: ["gpu"]

    # --- AMD ROCm & Intel Arc / XPU Device Passthrough (Linux) ---
    # Uncomment if running on Linux with AMD or Intel graphics:
    # devices:
    #   - /dev/kfd:/dev/kfd      # AMD ROCm
    #   - /dev/dri:/dev/dri      # AMD ROCm & Intel Arc / QuickSync
    # group_add:
    #   - "video"
    #   - "render"

  comfyui-cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    container_name: comfyui-cloudflare-tunnel
    profiles:
      - tunnel
      - cloudflare
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${COMFY_TUNNEL_TOKEN}

volumes:
  mss_login_data:
    driver: local
    name: mss_login_data
  comfyui_models:
    driver: local
    name: comfyui_models
  comfyui_output:
    driver: local
    name: comfyui_output
  comfyui_input:
    driver: local
    name: comfyui_input
  comfyui_user:
    driver: local
    name: comfyui_user
  comfyui_custom_nodes:
    driver: local
    name: comfyui_custom_nodes
  comfyui_venv:
    driver: local
    name: comfyui_venv
