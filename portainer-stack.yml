# Portainer Stack Definition for ComfyUI with MSS-Login
# Compatible with Portainer Web UI Stack Editor (Standalone Docker and Swarm)
# Hardware backend selection is driven entirely by environment variables (e.g. COMPOSE_PROFILES=cuda).
# Supports dedicated sub-image targets: auto, nvidia, rocm, and cpu.
# User-scripts run automatically before ComfyUI to download nodes, models, and custom packages.
#
# Works out of the box across macOS, Linux, and Windows 11 Pro (WSL2).

name: comfyui-mss-server

# ==============================================================================
# Common Reusable Configuration (YAML Anchors)
# ==============================================================================
x-comfyui-env: &comfyui-env
  HOST_BASE_URL: ${HOST_BASE_URL:-http://${HOST:-127.0.0.1}:${PORT:-8188}}
  SECRET_KEY: ${SECRET_KEY:-}
  MSS_LOGIN_DATA_DIR: ${MSS_LOGIN_DATA_DIR:-/data/mss-login}
  HF_HOME: ${HF_HOME:-/data/cache/huggingface}
  TORCH_HOME: ${TORCH_HOME:-/data/cache/torch}
  XDG_CACHE_HOME: ${XDG_CACHE_HOME:-/data/cache}
  COMFYUI_USER_SCRIPTS_DIR: ${COMFYUI_USER_SCRIPTS_DIR:-/app/user-scripts}
  CPE_EMBEDDED_CONVERT: ${CPE_EMBEDDED_CONVERT:-true}
  EXPERIMENTAL_LOGIN_BACKGROUND: ${EXPERIMENTAL_LOGIN_BACKGROUND:-true}
  WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
  WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-ComfyUI MSS-Login}
  WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
  PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
  FORCE_REINSTALL_TORCH: ${FORCE_REINSTALL_TORCH:-0}
  COMFYUI_COPILOT_PREFER_OPENAI_AGENTS: ${PREFER_OPENAI_AGENTS:-1}

x-comfyui-base: &comfyui-base
  init: true
  restart: unless-stopped
  shm_size: ${SHM_SIZE:-4g}
  security_opt:
    - no-new-privileges:true
  mem_limit: ${MEM_LIMIT:-20g}
  memswap_limit: ${MEMSWAP_LIMIT:-24g}
  oom_score_adj: 500
  dns:
    - 1.1.1.1
    - 8.8.8.8
  tty: true
  ports:
    - "${HOST:-127.0.0.1}:${PORT:-8188}:${PORT:-8188}/tcp"
  volumes:
    - ${COMFYUI_MSS_DATA_DIR:-mss_login_data}:${MSS_LOGIN_DATA_DIR:-/data/mss-login}
    - ${COMFYUI_CACHE_DIR:-comfyui_cache}:/data/cache
    - ${COMFYUI_USER_SCRIPTS_DIR:-comfyui_user_scripts}:/app/user-scripts
    - ${COMFYUI_MODELS_DIR:-comfyui_models}:/app/ComfyUI/models
    - ${COMFYUI_OUTPUT_DIR:-comfyui_output}:/app/ComfyUI/output
    - ${COMFYUI_INPUT_DIR:-comfyui_input}:/app/ComfyUI/input
    - ${COMFYUI_USER_DIR:-comfyui_user}:/app/ComfyUI/user
    - ${COMFYUI_CUSTOM_NODES_DIR:-comfyui_custom_nodes}:/app/ComfyUI/custom_nodes
    - ${COMFYUI_VENV_DIR:-comfyui_venv}:/app/ComfyUI/.venv
  labels:
    - "com.centurylinklabs.watchtower.enable=${AUTO_UPDATE:-true}"
  healthcheck:
    test: ["CMD", "curl", "-f", "http://127.0.0.1:${PORT:-8188}/mss-login/login"]
    interval: 30s
    timeout: 10s
    retries: 3
    start_period: 60s

# ==============================================================================
# Services (Selectable via COMPOSE_PROFILES environment variable)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Universal Auto-Detection (Default when COMPOSE_PROFILES is unset or 'auto')
  # ----------------------------------------------------------------------------
  comfyui-server:
    <<: *comfyui-base
    container_name: comfyui-server
    profiles: ["", "auto", "default"]
    build:
      context: .
      dockerfile: Dockerfile
      target: ${IMAGE_TARGET:-auto}
      args:
        ACCELERATOR: ${ACCELERATOR:-auto}
        CUDA_VERSION: ${CUDA_VERSION:-cu128}
        ROCM_VERSION: ${ROCM_VERSION:-rocm6.2.4}
    image: ${COMFYUI_IMAGE:-monster-spawned-studios/comfyui-mss-login:latest}
    pull_policy: ${PULL_POLICY:-build}
    environment:
      <<: *comfyui-env
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      CLI_ARGS: >-
        --listen 0.0.0.0 
        --port ${PORT:-8188} 
        --enable-cors-header=${CORS:-*} 
        --front-end-version Comfy-Org/ComfyUI_frontend@${FRONT_END_VERSION:-latest}  
        --reserve-vram ${VRAM_RESERVE_GB:-1} 
        --disable-smart-memory
        ${EXTRA_CLI_ARGS:---use-pytorch-cross-attention --cache-lru 1}
      DEVICE_TYPE: ${DEVICE_TYPE:-auto}
      USE_CPU: ${USE_CPU:-0}
    deploy:
      resources:
        limits:
          cpus: "${CPUS_LIMIT:-8}"
          memory: ${MEM_LIMIT:-20g}
        reservations:
          cpus: "${CPUS:-4}"
          memory: ${MEMORY:-8G}

  # ----------------------------------------------------------------------------
  # 2. NVIDIA CUDA Acceleration (Active when COMPOSE_PROFILES=cuda or nvidia or gpu)
  # ----------------------------------------------------------------------------
  comfyui-server-cuda:
    <<: *comfyui-base
    container_name: comfyui-server
    profiles: ["cuda", "nvidia", "gpu"]
    build:
      context: .
      dockerfile: Dockerfile
      target: nvidia
      args:
        ACCELERATOR: cuda
        CUDA_VERSION: ${CUDA_VERSION:-cu128}
    image: ${COMFYUI_IMAGE:-monster-spawned-studios/comfyui-mss-login:nvidia}
    pull_policy: ${PULL_POLICY:-build}
    environment:
      <<: *comfyui-env
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0}
      NVIDIA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      CLI_ARGS: >-
        --listen 0.0.0.0 
        --port ${PORT:-8188} 
        --enable-cors-header=${CORS:-*} 
        --front-end-version Comfy-Org/ComfyUI_frontend@${FRONT_END_VERSION:-latest}  
        --reserve-vram ${VRAM_RESERVE_GB:-1} 
        --disable-smart-memory
        ${EXTRA_CLI_ARGS:---use-pytorch-cross-attention --cache-lru 1}
      DEVICE_TYPE: cuda
      USE_CPU: 0
    deploy:
      resources:
        limits:
          cpus: "${CPUS_LIMIT:-8}"
          memory: ${MEM_LIMIT:-20g}
        reservations:
          cpus: "${CPUS:-4}"
          memory: ${MEMORY:-8G}
          devices:
            - driver: nvidia
              count: ${GPU_COUNT:-all}
              capabilities: ["gpu"]

  # ----------------------------------------------------------------------------
  # 3. AMD ROCm Acceleration (Active when COMPOSE_PROFILES=rocm or amd)
  # ----------------------------------------------------------------------------
  comfyui-server-rocm:
    <<: *comfyui-base
    container_name: comfyui-server
    profiles: ["rocm", "amd"]
    build:
      context: .
      dockerfile: Dockerfile
      target: rocm
      args:
        ACCELERATOR: rocm
        ROCM_VERSION: ${ROCM_VERSION:-rocm6.2.4}
    image: ${COMFYUI_IMAGE:-monster-spawned-studios/comfyui-mss-login:rocm}
    pull_policy: ${PULL_POLICY:-build}
    environment:
      <<: *comfyui-env
      CLI_ARGS: >-
        --listen 0.0.0.0 
        --port ${PORT:-8188} 
        --enable-cors-header=${CORS:-*} 
        --front-end-version Comfy-Org/ComfyUI_frontend@${FRONT_END_VERSION:-latest}  
        --reserve-vram ${VRAM_RESERVE_GB:-1} 
        --disable-smart-memory
        ${EXTRA_CLI_ARGS:---use-pytorch-cross-attention --cache-lru 1}
      DEVICE_TYPE: rocm
      USE_CPU: 0
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
    deploy:
      resources:
        limits:
          cpus: "${CPUS_LIMIT:-8}"
          memory: ${MEM_LIMIT:-20g}
        reservations:
          cpus: "${CPUS:-4}"
          memory: ${MEMORY:-8G}

  # ----------------------------------------------------------------------------
  # 4. CPU Execution Mode (Active when COMPOSE_PROFILES=cpu)
  # ----------------------------------------------------------------------------
  comfyui-server-cpu:
    <<: *comfyui-base
    container_name: comfyui-server
    profiles: ["cpu"]
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu
      args:
        ACCELERATOR: cpu
    image: ${COMFYUI_IMAGE:-monster-spawned-studios/comfyui-mss-login:cpu}
    pull_policy: ${PULL_POLICY:-build}
    environment:
      <<: *comfyui-env
      CLI_ARGS: >-
        --listen 0.0.0.0 
        --port ${PORT:-8188} 
        --enable-cors-header=${CORS:-*} 
        --front-end-version Comfy-Org/ComfyUI_frontend@${FRONT_END_VERSION:-latest}  
        --reserve-vram ${VRAM_RESERVE_GB:-1} 
        --disable-smart-memory
        ${EXTRA_CLI_ARGS:---cpu --cache-lru 1}
      DEVICE_TYPE: cpu
      USE_CPU: 1
    deploy:
      resources:
        limits:
          cpus: "${CPUS_LIMIT:-8}"
          memory: ${MEM_LIMIT:-20g}
        reservations:
          cpus: "${CPUS:-4}"
          memory: ${MEMORY:-8G}

  # ----------------------------------------------------------------------------
  # 5. Cloudflare Tunnel Companion (Active when COMPOSE_PROFILES=...,tunnel)
  # ----------------------------------------------------------------------------
  comfyui-cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    container_name: comfyui-cloudflare-tunnel
    profiles:
      - tunnel
      - cloudflare
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${COMFY_TUNNEL_TOKEN}

volumes:
  mss_login_data:
    driver: local
    name: mss_login_data
  comfyui_cache:
    driver: local
    name: comfyui_cache
  comfyui_user_scripts:
    driver: local
    name: comfyui_user_scripts
  comfyui_models:
    driver: local
    name: comfyui_models
  comfyui_output:
    driver: local
    name: comfyui_output
  comfyui_input:
    driver: local
    name: comfyui_input
  comfyui_user:
    driver: local
    name: comfyui_user
  comfyui_custom_nodes:
    driver: local
    name: comfyui_custom_nodes
  comfyui_venv:
    driver: local
    name: comfyui_venv
