# Portainer GitOps stack for ComfyUI with MSS-Login.
# Pulls the NVIDIA image. Nothing in this file builds from the git checkout.
# Publish ghcr.io/monster-spawned-studios/comfyui-mss-login:nvidia only from the
# manual workflow (.github/workflows/publish-ghcr.yml) with push_nvidia_tag set.
# Portainer re-pulls that tag only when stack auto-update or re-pull is on.
#
# Container name is comfyui-server (stack 250 ran comfyui-cuda-laptop).
# Point the Cloudflare tunnel at http://comfyui-server:9008.
# cloudflared is off unless COMPOSE_PROFILES=tunnel.
#
# CPU limits from stack 256: 8 maximum, 4 reserved.
# The process starts as root so root-owned volume files can be chowned to
# uid 1000 and so root can seed the MSS-Login tmpfs, then entrypoint.sh drops
# privileges. The tmpfs is locked root:root before that drop. Watchtower is off.

name: comfyui-mss-server

services:
  comfyui-server:
    init: true
    image: ${COMFYUI_IMAGE:-ghcr.io/monster-spawned-studios/comfyui-mss-login:nvidia}
    # development b43a28b. This stack has no build section, so "build" is not
    # valid here. missing (default) pulls only when the image is absent;
    # always re-pulls on every deploy, which acts like auto-update.
    pull_policy: ${PULL_POLICY:-missing}
    container_name: comfyui-server
    user: "0:0"
    restart: unless-stopped
    shm_size: ${SHM_SIZE:-4g}
    security_opt:
      - no-new-privileges:true
    mem_limit: ${MEM_LIMIT:-20g}
    memswap_limit: ${MEMSWAP_LIMIT:-24g}
    oom_score_adj: 500
    dns:
      - 1.1.1.1
      - 8.8.8.8
    tty: true
    ports:
      # Tailscale and loopback. Loopback is the host watchdog
      # (POST http://127.0.0.1:9008/free). The process listens on 0.0.0.0
      # so both published addresses reach it.
      - "${COMFYUI_BIND_TAILSCALE:-100.65.194.86}:${COMFYUI_PORT:-9008}:${COMFYUI_PORT:-9008}/tcp"
      - "127.0.0.1:${COMFYUI_PORT:-9008}:${COMFYUI_PORT:-9008}/tcp"
    environment:
      HOME: /home/comfy
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      # Fixed container paths. ComfyUI loads models and custom nodes from
      # /app/ComfyUI, so stack values of MODELS_DIR and NODES_DIR are not read.
      MODELS_DIR: /app/ComfyUI/models
      NODES_DIR: /app/ComfyUI/custom_nodes
      COMFYUI_CUSTOM_NODES_DIR: /app/ComfyUI/custom_nodes
      # The entrypoint builds the process argv. CLI_ARGS (stack 250) and
      # EXTRA_CLI_ARGS are the same extra string; both set and different refuses.
      # Defaults omit --listen and --port when that string already has them.
      COMFYUI_HOST: ${COMFYUI_HOST:-0.0.0.0}
      COMFYUI_PORT: ${COMFYUI_PORT:-9008}
      CORS: ${CORS:-*}
      VRAM_RESERVE_GB: ${VRAM_RESERVE_GB:-1.5}
      FRONTEND_VERSION: ${FRONTEND_VERSION:-v1.55.11}
      STACK_CLI_ARGS: ${CLI_ARGS:-}
      EXTRA_CLI_ARGS: ${EXTRA_CLI_ARGS:-}
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      TZ: ${TZ:-America/Boise}
      TIME_ZONE: ${TZ:-America/Boise}
      CIVITAI_TOKEN: ${CIVITAI_TOKEN:-}
      DEBUG_MODE: ${LOGIN_DEBUG_MODE:-false}
      SECRET_KEY: ${SECRET_KEY:-}
      NTFY_API_KEY: ${NTFY_AUTH_TOKEN:-}
      HOST_BASE_URL: ${HOST_BASE_URL:-http://127.0.0.1:9008}
      # MSS-Login reads auto_update from this directory's config.json.
      # entrypoint.sh forces enabled=true and mode=notify. There is no stack
      # variable for that block. In-place Update now is refused by the image patch.
      MSS_LOGIN_DATA_DIR: ${MSS_DATA_DIR:-/data/mss-login}
      POSTGRES_HOST: ${POST_HOST:-}
      POSTGRES_PORT: ${POST_PORT:-}
      POSTGRES_DATABASE: ${POST_DB:-}
      POSTGRES_USER: ${POST_USER:-}
      POSTGRES_PASSWORD: ${POST_PASS:-}
      COMFYUI_COPILOT_PREFER_OPENAI_AGENTS: ${PREFER_OPENAI_AGENTS:-1}
      # LD_LIBRARY_PATH is not set in the stack. Root unsets it. After setpriv,
      # the entrypoint points uid 1000 at the venv CUDA/cuDNN libraries.
      HF_HOME: /home/comfy/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /home/comfy/.cache/huggingface/hub
      TORCH_HOME: /home/comfy/.cache/torch
      XDG_CACHE_HOME: /home/comfy/.cache
      HF_TOKEN: ${HF_TOKEN:-}
      # Baked model downloader (development 9dc33b1), run as uid 1000 before
      # ComfyUI starts. The list is read as data from the user-scripts mount
      # (models-to-download.txt) or from MODELS_TO_DOWNLOAD. No host script runs.
      DOWNLOAD_MODELS: ${DOWNLOAD_MODELS:-true}
      MODELS_TO_DOWNLOAD: ${MODELS_TO_DOWNLOAD:-}
      CPE_EMBEDDED_CONVERT: ${CPE_EMBEDDED_CONVERT:-true}
      EXPERIMENTAL_LOGIN_BACKGROUND: ${EXPERIMENTAL_LOGIN_BACKGROUND:-true}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-ComfyUI MSS-Login}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      PYTHONUNBUFFERED: ${PYTHONUNBUFFERED:-1}
      DEVICE_TYPE: ${DEVICE_TYPE:-cuda}
      USE_CPU: ${USE_CPU:-0}
      FORCE_REINSTALL_TORCH: ${FORCE_REINSTALL_TORCH:-0}
      INSTALL_CUSTOM_NODE_DEPS: ${INSTALL_CUSTOM_NODE_DEPS:-true}
    volumes:
      - ${COMFYUI_USER_SCRIPTS_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/user-scripts}:/home/comfy/user-scripts:rw
      - ${COMFYUI_MODELS_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/models}:/app/ComfyUI/models:rw
      - ${COMFYUI_CUSTOM_NODES_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/nodes}:/app/ComfyUI/custom_nodes:rw
      - ${COMFYUI_OUTPUT_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/output}:/app/ComfyUI/output:rw
      - ${COMFYUI_INPUT_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/input}:/app/ComfyUI/input:rw
      - ${COMFYUI_USER_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/user}:/app/ComfyUI/user:rw
      - ${COMFYUI_MSS_DATA_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/mss-data}:${MSS_DATA_DIR:-/data/mss-login}:rw
      - ${COMFYUI_EXTRA_MODEL_PATHS:-/mnt/tmd-secure/Data/Docker/ComfyUI/extra_model_paths.yaml}:/app/ComfyUI/extra_model_paths.yaml:ro
      - ${COMFYUI_BASHRC:-/mnt/tmd-secure/Data/Docker/ComfyUI/.bashrc}:/home/comfy/.bashrc:rw
      - ${COMFYUI_HF_CACHE_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/hf-cache}:/home/comfy/.cache/huggingface/hub:rw
      - ${COMFYUI_TORCH_CACHE_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/torch-cache}:/home/comfy/.cache/torch/hub:rw
      # InstantID and PuLID read ComfyUI's models/insightface. The host directory
      # already holds antelopev2 and buffalo_l and must exist before deploy.
      - type: bind
        source: ${COMFYUI_INSIGHTFACE_DIR:-/mnt/tmd-secure/Data/Docker/ComfyUI/models/insightface}
        target: /app/ComfyUI/models/insightface
        read_only: true
        bind:
          create_host_path: false
    # Nested over the custom_nodes bind, at the folder ComfyUI loads.
    # No size: a small cap can fail the seed copy. uid 0 keeps the seed
    # root-owned. noexec is acceptable. The entrypoint refuses to start
    # unless mountinfo shows this path as tmpfs and empty before seeding.
    tmpfs:
      - /app/ComfyUI/custom_nodes/MSS-Login:uid=0,gid=0,mode=0755,noexec,nosuid
    labels:
      - "com.centurylinklabs.watchtower.enable=${AUTO_UPDATE:-false}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/mss-login-healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s
    deploy:
      resources:
        limits:
          cpus: "${CPUS_LIMIT:-8}"
          memory: ${MEM_LIMIT:-20g}
        reservations:
          cpus: "${CPUS:-4}"
          memory: ${MEMORY:-8G}
          devices:
            - driver: nvidia
              # development b43a28b: GPU count from the environment.
              # Pick devices with CUDA_VISIBLE_DEVICES / NVIDIA_VISIBLE_DEVICES.
              count: ${GPU_COUNT:-all}
              capabilities: ["gpu"]

  # Opt-in. In Portainer, set stack environment variable COMPOSE_PROFILES=tunnel.
  # Without that profile this service is not created.
  comfyui-prod-tunnel:
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    profiles:
      - tunnel
    restart: always
    container_name: comfyui-prod-tunnel
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${COMFY_TUNNEL_TOKEN:-}
    labels:
      - "com.centurylinklabs.watchtower.enable=${AUTO_UPDATE:-false}"
