# Portainer Stack Definition for ComfyUI with MSS-Login
# Compatible with Portainer Web UI Stack Editor (Standalone Docker and Swarm)
# Hardware-agnostic: does not assume a specific GPU backend.
# Runtime entrypoint auto-detects NVIDIA CUDA (cu130/cu128), AMD ROCm, Intel Arc/XPU, Apple Metal MPS, or CPU
# and automatically downloads/applies the matching PyTorch dependencies for ComfyUI.
#
# Environment variables configurable in Portainer UI:
# - HOST_BASE_URL: Public URL of your ComfyUI instance (e.g. https://ai.example.com)
# - SECRET_KEY: 32+ character random secret string for JWT and SQLCipher encryption
# - PORT: Host port mapping (default: 8188)
# - COMFYUI_IMAGE: Docker image to run (default: monster-spawned-studios/comfyui-mss-login:latest)
# - DEVICE_TYPE: Target device (auto, cuda, rocm, xpu, metal, cpu — defaults to auto)
# - CPE_EMBEDDED_CONVERT: Enable embedded headless graph parser & browser pool for Comfy Portal (true/false)

name: comfyui-server

services:
  comfyui:
    image: ${COMFYUI_IMAGE:-monster-spawned-studios/comfyui-mss-login:latest}
    container_name: comfyui-mss-login
    restart: unless-stopped
    ports:
      - "${HOST:-127.0.0.1}:${PORT:-8188}:${PORT:-8188}/tcp"
    environment:
      - HOST_BASE_URL=${HOST_BASE_URL:-http://${HOST:-127.0.0.1}:${PORT:-8188}}
      - SECRET_KEY=${SECRET_KEY:-}
      - MSS_LOGIN_DATA_DIR=${MSS_LOGIN_DATA_DIR:-/data/mss-login}
      - CPE_EMBEDDED_CONVERT=${CPE_EMBEDDED_CONVERT:-true}
      - EXPERIMENTAL_LOGIN_BACKGROUND=${EXPERIMENTAL_LOGIN_BACKGROUND:-true}
      - WEBAUTHN_RP_ID=${WEBAUTHN_RP_ID:-}
      - WEBAUTHN_ORIGINS=${WEBAUTHN_ORIGINS:-}
      - PYTHONUNBUFFERED=1
      - DEVICE_TYPE=${DEVICE_TYPE:-auto}
      - USE_CPU=${USE_CPU:-0}
      - CLI_ARGS=--listen ${HOST:-127.0.0.1} --port ${PORT:-8188}
    volumes:
      - mss_login_data:${MSS_LOGIN_DATA_DIR:-/data/mss-login}
      - comfyui_models:/app/ComfyUI/models
      - comfyui_output:/app/ComfyUI/output
      - comfyui_input:/app/ComfyUI/input
      - comfyui_user:/app/ComfyUI/user
      - comfyui_custom_nodes:/app/ComfyUI/custom_nodes
      - comfyui_venv:/app/ComfyUI/.venv
    labels:
      - "io.portainer.accesscontrol.public=true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8188/mss-login/login"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  mss_login_data:
    driver: local
  comfyui_models:
    driver: local
  comfyui_output:
    driver: local
  comfyui_input:
    driver: local
  comfyui_user:
    driver: local
  comfyui_custom_nodes:
    driver: local
  comfyui_venv:
    driver: local
