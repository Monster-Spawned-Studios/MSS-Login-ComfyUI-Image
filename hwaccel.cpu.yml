# Optional CPU overlay for a locally built cpu target.
# Not used by Portainer. The publish workflow does not push :cpu.
#   docker build --target cpu -t ghcr.io/monster-spawned-studios/comfyui-mss-login:cpu .
services:
  comfyui-server:
    image: ghcr.io/monster-spawned-studios/comfyui-mss-login:cpu
    environment:
      DEVICE_TYPE: cpu
      USE_CPU: "1"
