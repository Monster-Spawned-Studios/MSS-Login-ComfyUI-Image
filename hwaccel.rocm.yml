# Optional ROCm overlay for a locally built rocm target.
# Not used by Portainer. The publish workflow does not push :rocm.
#   docker build --target rocm -t ghcr.io/monster-spawned-studios/comfyui-mss-login:rocm .
services:
  comfyui-server:
    image: ghcr.io/monster-spawned-studios/comfyui-mss-login:rocm
    environment:
      DEVICE_TYPE: rocm
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - "video"
      - "render"
