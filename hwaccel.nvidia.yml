# Optional NVIDIA overlay. portainer-stack.yml already enables both GPUs
# and pulls :nvidia. Do not add this file to the Portainer GitOps stack.
# The workflow does not build from this file.
# Device reservation already lives in portainer-stack.yml. Repeating it
# here would append a second GPU request when the files are merged.
services:
  comfyui-server:
    image: ${COMFYUI_IMAGE:-ghcr.io/monster-spawned-studios/comfyui-mss-login:nvidia}
    pull_policy: ${PULL_POLICY:-missing}
    environment:
      DEVICE_TYPE: cuda
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
